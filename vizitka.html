<title>Мацалик Марина — визитка</title>
<style>
  :root{
    --bg:#f6f3ee;
    --card:#ffffff;
    --border:#e8e2d6;
    --text:#231f1a;
    --muted:#7a7369;
    --accent1:#b8863f;
    --accent2:#7c5cd9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 15%, rgba(124,92,217,0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(184,134,63,0.12), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:40px 32px;
    text-align:center;
    box-shadow:0 20px 50px rgba(35,31,26,0.08);
    animation:fadeUp 0.7s ease both;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
  }

  .avatar{
    position:relative;
    width:132px;
    height:132px;
    margin:0 auto 20px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 5px #ffffff, 0 0 0 6px var(--border), 0 12px 30px rgba(184,134,63,0.25);
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .avatar-fallback{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--accent2), var(--accent1));
    color:#fff;
    font-size:36px;
    font-weight:700;
  }

  h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.3px;
    background:linear-gradient(90deg, #2a261f, var(--accent1) 60%, var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .role{
    margin:0 0 26px;
    color:var(--muted);
    font-size:14.5px;
    letter-spacing:0.4px;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border), transparent);
    margin:0 0 26px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:28px;
  }

  .social-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#faf8f4;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    text-decoration:none;
  }

  .social-icon svg{
    width:22px;
    height:22px;
    stroke:var(--muted);
    transition:stroke 0.25s ease;
  }

  .social-icon:hover{
    transform:translateY(-4px) scale(1.06);
    border-color:var(--accent1);
    background:#fbf1de;
    box-shadow:0 8px 20px rgba(184,134,63,0.2);
  }

  .social-icon:hover svg{
    stroke:var(--accent1);
  }

  .cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:100%;
    justify-content:center;
    padding:15px 24px;
    border-radius:14px;
    border:none;
    background:linear-gradient(90deg, var(--accent2), var(--accent1));
    color:#ffffff;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    overflow:hidden;
    isolation:isolate;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow:0 10px 26px rgba(124,92,217,0.25);
  }

  .cta::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform:translateX(-120%);
    transition:transform 0.6s ease;
    z-index:-1;
  }

  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 32px rgba(124,92,217,0.35);
  }

  .cta:hover::before{
    transform:translateX(120%);
  }

  .cta svg{
    width:20px;
    height:20px;
  }

  .cta-secondary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:100%;
    justify-content:center;
    padding:13px 24px;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    margin-top:12px;
    transition:transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .cta-secondary:hover{
    transform:translateY(-2px);
    border-color:var(--accent1);
    background:#faf8f4;
  }

  .cta-secondary svg{
    width:18px;
    height:18px;
    stroke:var(--accent1);
  }

  .footer-note{
    margin-top:22px;
    font-size:12px;
    color:#a29a8c;
    letter-spacing:0.3px;
  }

  @media (max-width:480px){
    .card{padding:32px 22px; border-radius:20px;}
    h1{font-size:22px;}
    .avatar{width:96px; height:96px;}
    .avatar-fallback{font-size:30px;}
  }
</style>
